# Every workflow, model or tool shown on the home page. The order here does
# not matter: the page sorts by date (newest first) and the newest entry is
# featured at the top automatically. Fields:
#
#   slug:     unique id, used by _data/series.yml
#   title:    card title
#   text:     one sentence saying what the reader will do or get
#   category: one id from _data/categories.yml
#   tools:    software used (each one becomes a filter)
#   url:      where the card leads
#   image:    file inside assets/img/cards/ (WebP, about 960 px wide); a
#             light mode version with the same name goes in
#             assets/img/cards/light/. When the card has an animated figure
#             (a scene with the same slug in assets/js/card-figures.js) both
#             are stills of that figure
#   alt:      description of the image for screen readers
#   added:    date the entry was published (YYYY-MM-DD); the dates below are
#             the first commit of each repository. Entries from the last 180
#             days get a "New" label. Leave it out if unknown.

- slug: go-sheets
  title: Graphene oxide structures
  text: GAFF2-AIM graphene oxide sheet models in GROMACS format, from the J. Phys. Chem. B 2022 study on biomolecule adsorption.
  category: models
  tools: [GROMACS, CP2K, Chargemol]
  url: https://arvpinto.github.io/GO_sheets/
  image: graphene-oxide.webp
  alt: Rippling graphene oxide sheet in matte grey with a neon glow where an aromatic molecule lies flat on its surface, 3.5 angstrom above it
  added: 2022-07-06

- slug: static-qmmm
  title: Static QM/MM
  text: Locate reactant, transition state and product geometries with the CI-NEB and dimer methods.
  category: qmmm
  tools: [CP2K, parmed]
  url: https://arvpinto.github.io/enzyme_neb_cp2k/
  image: static-qmmm.webp
  alt: QM region of human phospholipase A2 moving from reactant to product next to the climbing-image NEB energy profile of its 16 images
  added: 2023-03-22

# Date unknown (repository not public): please add "added:".
- slug: dynamic-qmmm
  title: Dynamic QM/MM
  text: Run QM/MM molecular dynamics along the reaction coordinate to obtain the free energy profile.
  category: qmmm
  tools: [CP2K]
  url: https://arvpinto.github.io/enzyme_us_cp2k/
  image: dynamic-qmmm.webp
  alt: Umbrella sampling histograms filling in window by window along the reaction coordinate, joined by WHAM into the free energy profile with its barrier

- slug: residue-deletion
  title: Per-residue contributions to the barrier
  text: Delete or mutate residues, one at a time or several at once, and recalculate the QM/MM reactant and transition state energies to see how each change affects the activation energy.
  category: qmmm
  tools: [CP2K, AmberTools, cpptraj, parmed, Python]
  url: https://arvpinto.github.io/enzyme_mutagenesis_cp2k/
  image: residue-deletion.webp
  alt: Human phospholipase A2 cartoon with the QM region at its centre and a bar chart of the change in barrier as each residue is deleted
  added: 2024-06-09

# Date unknown (repository not public): please add "added:".
- slug: macrodipole
  title: Transition state macrodipole
  text: Calculate the dipole moment of the enzyme and how it is oriented relative to the transition state.
  category: qmmm
  tools: [CP2K]
  url: https://arvpinto.github.io/enzyme_ts_macrodipole/
  image: macrodipole.webp
  alt: Phospholipase A2 turning with its acidic and basic side chains in red and blue and an arrow for the macrodipole, with its angle to the active site

- slug: pca-clustering
  title: 3D clustering of PCA vectors
  text: Cluster an MD trajectory on its first three principal components with DBSCAN and Gaussian mixture models, then extract the most representative frames.
  category: md
  tools: [GROMACS, Python]
  url: https://arvpinto.github.io/3D_clustering_PCA/
  image: pca-clustering.webp
  alt: Trajectory frames of chignolin as a rotating 3D cloud on the first three principal components, coloured by cluster
  added: 2025-03-03

- slug: dihedral
  title: Parameterizing a dihedral angle
  text: Refit GAFF2 dihedral parameters against a quantum mechanical torsion scan.
  category: ff
  tools: [Gaussian, AmberTools, parmed, GROMACS]
  url: https://arvpinto.github.io/GAFF2_dihedral_parameterization/
  image: dihedral.webp
  alt: 1,3-propanediol turning about its central torsion beside the QM scan points and the GAFF2 profile refitted to them
  added: 2025-11-10

- slug: scienista
  title: Scienista
  text: An offline Android app for computational chemistry, with a lab notebook, literature hub, HPC workbench, structure studio and paper kit.
  category: software
  tools: [Android]
  url: https://arvpinto.github.io/scienista/
  image: compchemkit.webp
  alt: Three phones with neon edges cycling through the CompChemKit modules, from the lab notebook to the paper kit
  added: 2026-09-22

- slug: qmmm-prep
  title: Preparing a QM/MM system
  text: Build a QM/MM model of an enzyme-ligand complex, from the PDB structure to a validated set of CP2K inputs.
  category: qmmm
  tools: [AmberTools, parmed, VMD, CP2K]
  url: https://arvpinto.github.io/enzyme_qmmm_prep_cp2k/
  image: qmmm-prep.webp
  alt: Amylase opened at its active site, with a selection sphere around the substrate and the 65-atom QM region glowing in ball-and-stick
  added: 2026-10-25

- slug: abcg2-charges
  title: Conformer-averaged ABCG2 charges
  text: Average ABCG2 partial charges over the conformers of a flexible molecule until the mean converges, with MHET as the worked example.
  category: ff
  tools: [AmberTools, RDKit, Python]
  url: https://arvpinto.github.io/abcg2_charges_multi/
  image: abcg2-charges.webp
  alt: MHET in ball-and-stick with atoms coloured by ABCG2 charge, red negative and blue positive, beside the charge of every heavy atom across conformers
  added: 2026-10-27

- slug: pka-comparison
  title: Comparing protein pKa predictors to assign protonation states
  text: Run PROPKA3, PypKa, DelPhiPKa, pKAI and pKAI+ on the same protein structure, merge their pKa values into one table and assign protonation states at a target pH by consensus, with hen egg-white lysozyme (4LZT) as the worked example.
  category: md
  tools: [PROPKA3, PypKa, DelPhiPKa, pKAI, Python]
  url: https://arvpinto.github.io/pka_comparison/
  image: pka-comparison.webp
  alt: Lysozyme cartoon whose titratable groups turn from blue (protonated) to red (deprotonated) as the pH sweeps from 2 to 12, with the disulfides in yellow
  added: 2026-10-29

