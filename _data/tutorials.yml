# Every tutorial, archive or app shown on the home page. The order here does
# not matter: the page sorts by date (newest first) and the newest entry is
# featured at the top automatically. Fields:
#
#   slug:     unique id, used by _data/tracks.yml
#   title:    card title
#   text:     one sentence saying what the reader will do or get
#   category: one id from _data/categories.yml
#   tools:    software used (each one becomes a filter)
#   url:      where the card leads
#   image:    file inside assets/img/cards/ (WebP, about 900 px wide)
#   alt:      description of the image for screen readers
#   added:    date the tutorial was published (YYYY-MM-DD); the dates below are
#             the first commit of each repository. Entries from the last 180
#             days get a "New" label. Leave it out if unknown.

- slug: go-sheets
  title: Graphene oxide structures
